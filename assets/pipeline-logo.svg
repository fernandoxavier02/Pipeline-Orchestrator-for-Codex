<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline Orchestrator for Codex logo</title>
  <desc id="desc">A refined pipeline orchestration logo with connected workflow nodes and a verified gate.</desc>
  <defs>
    <linearGradient id="bg" x1="58" y1="32" x2="454" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F3D2E"/>
      <stop offset="0.5" stop-color="#14532D"/>
      <stop offset="1" stop-color="#061A16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(210 0 0 210 348 150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.12"/>
